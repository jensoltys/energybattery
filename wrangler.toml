# Energy Battery: Cloudflare Worker + D1. See README.md for setup.
name = "energy-battery"
main = "src/worker.js"
workers_dev = true
compatibility_date = "2025-04-01"

# Using your own domain? Uncomment and change:
# routes = [ { pattern = "example.com", custom_domain = true } ]

assets = { directory = "./public", binding = "ASSETS", run_worker_first = ["/*"], not_found_handling = "404-page" }

[[d1_databases]]
binding = "DB"
database_name = "energy-battery"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"   # from: npx wrangler d1 create energy-battery

[observability]
enabled = true

# Daily purge of expired rate-limit rows and old reset / verification tokens.
[triggers]
crons = ["17 9 * * *"]

[vars]
# The app's name in alert and feedback webhook messages.
APP_NAME = "Energy Battery"
APP_URL = "https://energy-battery.YOUR-SUBDOMAIN.workers.dev"
FROM_EMAIL = "Energy Battery <noreply@example.com>"
# Optional extras (blank = off):
ALERT_WEBHOOK_URL = ""
SIGNUP_WEBHOOK_URL = ""
FEEDBACK_WEBHOOK_URL = ""
# Everyone is on the free plan.

# Secrets: set each with `npx wrangler secret put NAME`. See .dev.vars.example.
# Required: JWT_SECRET, RESEND_API_KEY
# Optional: ALERT_TOKEN, SIGNUP_WEBHOOK_SECRET
